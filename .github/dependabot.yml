# Dependabot: weekly grouped minor/patch updates; majors arrive as separate PRs for review.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    ignore:
      # springdoc 2.9 needs Spring Boot 3.5 and 3.x needs Boot 4; stay on 2.8.x while on Boot 3.4.
      - dependency-name: "org.springdoc:*"
        versions: [">=2.9.0"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
    groups:
      github_actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
